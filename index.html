<style>
:root{
  --brand:#6b8f35;
  --brand-dark:#587529;
  --bg:#f6f7f9;
  --text:#0f1218;
  --soft:#f4f7ec;
  --muted:#64748b;
  --border:#e2e8f0;
  --mp:#009ee3;
  --white:#ffffff;
  --r-sm:12px;
  --r-md:16px;
  --r-lg:24px;
  --shadow:0 1px 2px rgba(15,18,24,.04), 0 8px 24px -12px rgba(15,18,24,.10);
  --sidebar-w:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.icon{width:18px;height:18px;stroke-width:2}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:none;background:var(--white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
}
.brand-row{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-mark{width:36px;height:36px;border-radius:var(--r-sm);background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.brand-name{font-weight:800;font-size:16px;line-height:1.1}
.brand-tag{font-size:11px;color:var(--muted);text-transform:lowercase}
.search-box{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:14px}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--text)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.nav-item:hover{background:var(--soft)}
.nav-item.active{background:var(--soft);color:var(--brand-dark)}
.nav-item.active svg{color:var(--brand)}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.admin-dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:none;cursor:pointer}
.admin-dot:hover{background:var(--muted)}

.topbar{display:none;position:sticky;top:0;z-index:30;background:var(--white);border-bottom:1px solid var(--border);align-items:center;gap:10px;padding:12px 14px}
.topbar .brand-row{padding:0}
.icon-btn{background:none;border:none;padding:8px;border-radius:var(--r-sm);display:flex}
.icon-btn:hover{background:var(--soft)}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(15,18,24,.4);z-index:40}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:#fff;z-index:41;padding:18px 14px;transform:translateX(-100%);transition:transform .2s ease}
.drawer.open{transform:translateX(0)}
.drawer-backdrop.open{display:block}

main{flex:1;min-width:0}
.container{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
@media (max-width:860px){
  .sidebar{display:none}
  .topbar{display:flex}
  .container{padding:18px 16px 90px}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:none;font-weight:700;font-size:14px;transition:transform .15s ease,opacity .15s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--brand)}
.btn-mp{background:var(--mp);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-danger{background:#fff;color:#c0362c;border:1px solid #f1c6c1}

/* ---------- Hero / Home ---------- */
.hero{background:var(--soft);border-radius:var(--r-lg);padding:48px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;margin-bottom:36px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--brand-dark);margin-bottom:16px}
.hero h1{font-size:38px;line-height:1.12;margin:0 0 12px;font-weight:800;letter-spacing:-.5px}
.hero p{color:var(--muted);font-size:16px;line-height:1.55;margin:0 0 22px;max-width:46ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-visual{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);padding:18px;box-shadow:var(--shadow)}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding:28px 20px}.hero h1{font-size:28px}.hero-visual{display:none}}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:36px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px}
.stat-num{font-size:26px;font-weight:800}
.stat-label{color:var(--muted);font-size:13px;margin-top:2px}
@media (max-width:640px){.stats-row{grid-template-columns:1fr}}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px}
.section-head h2{font-size:20px;font-weight:800;margin:0}
.section-head a{font-size:13px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;gap:4px}
section.block{margin-bottom:40px}

.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.benefit-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:18px}
.benefit-card .ico{width:38px;height:38px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--brand-dark);margin-bottom:10px}
.benefit-card h3{font-size:14px;margin:0 0 4px}
.benefit-card p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4}
@media (max-width:860px){.benefits{grid-template-columns:repeat(2,1fr)}}

.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--border);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700}
.pill.active,.pill:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--soft)}

.grid-products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:960px){.grid-products{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.grid-products{grid-template-columns:repeat(2,1fr)}}
.card-prod{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card-prod .imgwrap{aspect-ratio:1/1;background:var(--soft);overflow:hidden}
.card-prod img{width:100%;height:100%;object-fit:cover}
.card-prod .body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-prod .cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.card-prod .title{font-size:13.5px;font-weight:700;line-height:1.3;min-height:34px}
.card-prod .price-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.price{font-weight:800;font-size:15px}
.price-orig{font-size:12px;color:var(--muted);text-decoration:line-through}
.match-badge{position:absolute;top:10px;right:10px;background:rgba(15,18,24,.78);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
.card-prod .add-btn{margin-top:8px}

/* ---------- Feed swipe ---------- */
.feed-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.feed-stage{position:relative;width:100%;max-width:340px;height:440px}
.swipe-card{position:absolute;inset:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;user-select:none;touch-action:pan-y;cursor:grab}
.swipe-card .imgwrap{flex:1;background:var(--soft);overflow:hidden}
.swipe-card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.swipe-card .info{padding:14px 16px 16px}
.swipe-card .cat{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.swipe-card .title{font-weight:800;font-size:16px;margin:2px 0 6px}
.swipe-card .price{font-size:17px;font-weight:800;color:var(--brand-dark)}
.swipe-stamp{position:absolute;top:20px;padding:6px 14px;border:3px solid;border-radius:8px;font-weight:900;font-size:18px;letter-spacing:.05em;opacity:0;transform:rotate(-14deg)}
.swipe-stamp.like{left:18px;color:var(--brand-dark);border-color:var(--brand-dark)}
.swipe-stamp.skip{right:18px;color:#c0362c;border-color:#c0362c;transform:rotate(14deg)}
.feed-actions{display:flex;align-items:center;gap:14px}
.round-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.round-btn.skip{color:#c0362c}
.round-btn.like{color:var(--brand-dark)}
.round-btn.add{width:60px;height:60px;background:var(--brand);color:#fff;border:none}
.feed-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px}

.suggested-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.sugg-card{flex:0 0 150px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.sugg-card .imgwrap{aspect-ratio:1/1;background:var(--soft)}
.sugg-card img{width:100%;height:100%;object-fit:cover}
.sugg-card .why{font-size:10.5px;color:var(--brand-dark);font-weight:700;padding:8px 10px 0}
.sugg-card .title{font-size:12px;font-weight:700;padding:2px 10px 10px;line-height:1.3}

.seo-text{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 30px;color:var(--muted);font-size:13.5px;line-height:1.7}
.seo-text h2{color:var(--text);font-size:18px;margin-top:0}
.seo-text h3{color:var(--text);font-size:14px}

footer{border-top:1px solid var(--border);background:#fff;margin-top:20px}
.footer-inner{max-width:1180px;margin:0 auto;padding:32px 24px 22px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
.footer-inner h4{font-size:13px;margin:0 0 10px}
.footer-inner a{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.footer-inner a:hover{color:var(--brand-dark)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);max-width:1180px;margin:0 auto}
@media (max-width:860px){.footer-inner{grid-template-columns:1fr 1fr}}

/* ---------- Filters / product list ---------- */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}

/* ---------- Cart ---------- */
.cart-item{display:flex;gap:14px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.cart-item img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--soft)}
.cart-item .info{flex:1;min-width:0}
.cart-item .name{font-weight:700;font-size:13.5px}
.cart-item .cat{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty-btn{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center}
.qty-val{font-weight:700;font-size:13px;min-width:18px;text-align:center}
.remove-link{font-size:12px;color:#c0362c;font-weight:700;display:flex;align-items:center;gap:4px;margin-top:6px}
.summary-box{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:18px}
.summary-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;color:var(--muted)}
.summary-row.total{color:var(--text);font-weight:800;font-size:16px;border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.cart-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
@media (max-width:860px){.cart-layout{grid-template-columns:1fr}}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13.5px;font-family:inherit;background:#fff;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option-card{border:1px solid var(--border);border-radius:var(--r-md);padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;background:#fff}
.option-card input{width:auto}
.option-card.selected{border-color:var(--brand);background:var(--soft)}
.option-card .ot{font-weight:700;font-size:13.5px}
.option-card .os{font-size:12px;color:var(--muted)}

/* ---------- Success ---------- */
.success-wrap{text-align:center;padding:60px 20px;max-width:460px;margin:0 auto}
.success-ico{width:72px;height:72px;border-radius:50%;background:var(--soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.ref-box{background:#fff;border:1px dashed var(--border);border-radius:var(--r-md);padding:14px;font-weight:800;font-size:16px;letter-spacing:.05em;margin:16px 0}

/* ---------- Live ---------- */
.live-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:30px;text-align:center;max-width:520px;margin:0 auto}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:#fee2e2;color:#c0362c;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;margin-bottom:14px}

/* ---------- Contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}
.contact-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:18px;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.contact-card .ico{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- Admin ---------- */
.admin-login-wrap{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:28px}
.admin-tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:20px}
.admin-tab{padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.admin-tab.active{color:var(--brand-dark);border-color:var(--brand)}
.admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
table.admin-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
table.admin-table th,table.admin-table td{padding:10px 12px;font-size:12.5px;text-align:left;border-bottom:1px solid var(--border)}
table.admin-table th{background:var(--soft);font-weight:800;color:var(--brand-dark)}
table.admin-table tr:last-child td{border-bottom:none}
.badge-ok{background:var(--soft);color:var(--brand-dark);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.badge-off{background:#f1f5f9;color:var(--muted);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,18,24,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:var(--r-lg);padding:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{margin-top:0}
.admin-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:20px;margin-bottom:16px}
.admin-card h3{margin:0 0 14px;font-size:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.switch{position:relative;width:40px;height:22px;background:var(--border);border-radius:999px;border:none;flex:none}
.switch.on{background:var(--brand)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s}
.switch.on::after{transform:translateX(18px)}
.color-swatch{width:28px;height:28px;border-radius:8px;border:1px solid var(--border)}
.mini{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.empty-state{text-align:center;color:var(--muted);padding:50px 20px;font-size:13.5px}
.cart-fab{position:fixed;bottom:18px;right:18px;background:var(--brand);color:#fff;border:none;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:20}
.cart-fab .count{position:absolute;top:-4px;right:-4px;background:#c0362c;color:#fff;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@media (min-width:861px){.cart-fab{display:none}}

.whatsapp-fab{position:fixed;bottom:18px;left:18px;background:#25D366;color:#fff;border:none;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:25;transition:transform .15s ease}
.whatsapp-fab:hover{transform:scale(1.06)}
.whatsapp-fab svg{width:28px;height:28px}
@media (max-width:860px){.whatsapp-fab{bottom:82px;width:50px;height:50px}.whatsapp-fab svg{width:26px;height:26px}}

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session?.access_token || SUPABASE_ANON_KEY}`,
      'Content-Type':'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error(t || res.statusText); }
  return res.status===204 ? null : res.json();
}
async function loadData(){
  if(HAS_SUPABASE){
    try{
      const [prods, settingsRows] = await Promise.all([
        sb('products?select=*&order=sort_order.asc'),

      ]);
      state.products = (prods||[]).filter(p=>p.active !== false);
      if(settingsRows && settingsRows[0]) state.settings = {...DEFAULT_SETTINGS, ...settingsRows[0]};

/* ---------- 6. Motor de gustos v2 (localStorage: akari_prefs_v2) ---------- */
const PREFS_KEY = 'akari_prefs_v2';
function loadPrefs(){
  return lsGet(PREFS_KEY, { categories:{}, brands:{}, priceSum:0, priceCount:0, seen:{}, skipped:{}, session:[] });
}
function savePrefs(p){ lsSet(PREFS_KEY, p); }
function recordSignal(product, type){
  // type: 'like' (+2), 'cart' (+3), 'skip' (-1.5), 'view' (0, solo novelty/fatiga)
  const prefs = loadPrefs();
  const weight = type==='like'?2:type==='cart'?3:type==='skip'?-1.5:0;
  if(weight !== 0){
    prefs.categories[product.category] = (prefs.categories[product.category]||0)*0.9 + weight;
    prefs.brands[product.brand] = (prefs.brands[product.brand]||0)*0.9 + weight;
    if(weight > 0){ prefs.priceSum += product.price; prefs.priceCount += 1; }
  }
  if(type==='skip') prefs.skipped[product.id] = (prefs.skipped[product.id]||0)+1;
  prefs.seen[product.id] = (prefs.seen[product.id]||0)+1;
  prefs.session.push(product.id);
  if(prefs.session.length>40) prefs.session.shift();
  savePrefs(prefs);
}
function scoreProduct(product, prefs){
  let score = (product.match_score||70)/100; // base
  score += (prefs.categories[product.category]||0) * 0.12;
  score += (prefs.brands[product.brand]||0) * 0.08;
  const avgPrice = prefs.priceCount ? prefs.priceSum/prefs.priceCount : null;
  if(avgPrice){ const diff = Math.abs(product.price-avgPrice)/avgPrice; score -= Math.min(diff,1)*0.15; }
  if(!prefs.seen[product.id]) score += 0.18; // novelty
  const fatigue = prefs.seen[product.id]||0;
  score -= Math.min(fatigue*0.1, 0.4);
  score -= Math.min((prefs.skipped[product.id]||0)*0.3, 0.9);
  score += Math.random()*0.06; // ruido leve
  return score;
}
function buildFeed(){
  const prefs = loadPrefs();
  const pool = [...state.products];
  let scored = pool.map(p=>({p, s:scoreProduct(p, prefs)})).sort((a,b)=>b.s-a.s);
  // ~15% exploración: mezclar un ítem random cada 6 posiciones
  const explore = 0.15;
  let ordered = [];
  const rest = [...scored];
  while(rest.length){
    if(Math.random() < explore && rest.length>1){
      const idx = Math.floor(Math.random()*rest.length);
      ordered.push(rest.splice(idx,1)[0]);
    } else {
      ordered.push(rest.shift());
    }
  }
  // diversidad: evitar 3 seguidas de misma categoría
  const final = [];
  for(const item of ordered){
    if(final.length>=2 && final[final.length-1].p.category===item.p.category && final[final.length-2].p.category===item.p.category){
      const swapIdx = ordered.findIndex((o,i)=> o!==item && o.p.category!==item.p.category);
      // simple: solo empujar al final
      final.push(item);
    } else {
      final.push(item);
    }
  }
  return final.map(x=>x.p);
}

  const existing = state.cart.find(i=>i.id===product.id);

  else state.cart.push({id:product.id, title:product.title, price:product.price, image_url:product.image_url, category:product.category, qty});

  const item = state.cart.find(i=>i.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) state.cart = state.cart.filter(i=>i.id!==id);
  saveCart(); render();
}

  <div class="suggested-strip" id="suggested-strip"></div>
  `;
}
function renderFeedStage(){
  const stage = $('#feed-stage');
  if(!stage) return;
  stage.innerHTML='';
  const items = feedState.items.slice(feedState.index, feedState.index+2);
  if(!items.length){ stage.innerHTML = `<div class="feed-empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:24px">Reiniciando sugerencias...</div>`; icons(); setTimeout(()=>{feedState.index=0; renderFeedStage();},900); return; }
  items.slice().reverse().forEach((p,i)=>{
    const isTop = (i===items.length-1);
    const card = document.createElement('div');
    card.className='swipe-card';
    card.style.transform = isTop ? 'none' : 'scale(.94) translateY(10px)';
    card.style.zIndex = isTop? 2:1;
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="swipe-stamp like">ME GUSTA</div>
      <div class="swipe-stamp skip">PASO</div>
      <div class="imgwrap"><img src="${p.image_url}" alt="${p.title}"></div>
      <div class="info">
        <div class="cat">${p.category}</div>
        <div class="title">${p.title}</div>
        <div class="price">${fmtMoney(p.price)}</div>
      </div>
      <div class="match-badge" style="top:14px;right:14px">${p.match_score||70}% match</div>
    `;
    stage.appendChild(card);
    if(isTop) attachDrag(card, p);
  });
  renderSuggestedStrip();
  icons();
}
function attachDrag(card, product){
  let startX=0, startY=0, dx=0, dragging=false;
  const likeStamp = card.querySelector('.swipe-stamp.like');
  const skipStamp = card.querySelector('.swipe-stamp.skip');
  function onDown(x,y){ dragging=true; startX=x; startY=y; card.style.transition='none'; card.style.cursor='grabbing'; }
  function onMove(x,y){
    if(!dragging) return;
    dx = x-startX;
    const rot = dx/18;
    card.style.transform = `translate(${dx}px, ${(y-startY)*.15}px) rotate(${rot}deg)`;
    likeStamp.style.opacity = Math.min(Math.max(-dx/80,0),1);
    skipStamp.style.opacity = Math.min(Math.max(dx/80,0),1);
  }
  function onUp(){
    if(!dragging) return; dragging=false; card.style.cursor='grab'; card.style.transition='transform .25s ease, opacity .25s ease';
    if(dx<-110){ finishSwipe(card, product, 'like'); }
    else if(dx>110){ finishSwipe(card, product, 'skip'); }
    else { card.style.transform='none'; likeStamp.style.opacity=0; skipStamp.style.opacity=0; }
    dx=0;
  }
  card.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
  window.addEventListener('mouseup', onUp);
  card.addEventListener('touchstart', e=>{const t=e.touches[0]; onDown(t.clientX,t.clientY);}, {passive:true});
  card.addEventListener('touchmove', e=>{const t=e.touches[0]; onMove(t.clientX,t.clientY);}, {passive:true});
  card.addEventListener('touchend', onUp);
}
function finishSwipe(card, product, type){
  const dir = type==='like'?1:-1;
  card.style.transform = `translate(${dir*500}px, -40px) rotate(${dir*30}deg)`;
  card.style.opacity='0';
  recordSignal(product, type);
  feedState.index++;
  setTimeout(renderFeedStage, 200);
}
function feedAction(type){
  const p = feedState.items[feedState.index];
  if(!p) return;
  if(type==='cart') addToCart(p,1);
  const card = $(`#feed-stage .swipe-card[data-id="${p.id}"]`);
  if(card) finishSwipe(card, p, type==='cart'?'like':type);
  else { recordSignal(p, type==='cart'?'like':type); feedState.index++; renderFeedStage(); }
}
function renderSuggestedStrip(){
  const strip = $('#suggested-strip');
  if(!strip) return;
  const prefs = loadPrefs();
  const topCat = Object.entries(prefs.categories).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const avgPrice = prefs.priceCount ? prefs.priceSum/prefs.priceCount : null;
  const list = [...state.products].sort((a,b)=>scoreProduct(b,prefs)-scoreProduct(a,prefs)).slice(0,10);
  strip.innerHTML = list.map(p=>{
    let why = 'Recomendado';
    if(topCat && p.category===topCat) why = `Por ${topCat}`;
    else if(avgPrice && Math.abs(p.price-avgPrice)/avgPrice<0.25) why = 'En tu rango de precio';
    return `<a class="sugg-card" href="#/producto-${p.id}" onclick="event.preventDefault(); addToCart(state.products.find(x=>x.id==='${p.id}'))">
      <div class="imgwrap"><img src="${p.image_url}" alt="${p.title}"></div>
      <div class="why">${why}</div>
      <div class="title">${p.title}</div>
    </a>`;
  }).join('');
}

async function submitOrder(){
  if(!checkoutState.name || !checkoutState.phone){ toast('Completá nombre y WhatsApp'); return; }
  const order = {
    ref: 'AK-' + Date.now().toString(36).toUpperCase(),
    items: state.cart, total: cartTotal(),
    customer:{name:checkoutState.name, phone:checkoutState.phone, email:checkoutState.email},
    delivery: checkoutState.delivery, address: checkoutState.address,
    payment: checkoutState.payment, status: 'pendiente', created_at: new Date().toISOString()
  };
  // Guardar orden (Supabase si hay backend, si no localStorage)
  try{
    if(HAS_SUPABASE){
      await sb('orders', { method:'POST', body: JSON.stringify(order) });
    } else {
      const orders = lsGet('akari_demo_orders', []); orders.unshift(order); lsSet('akari_demo_orders', orders);
    }
  }catch(e){ console.warn('No se pudo guardar el pedido en Supabase, se guarda local.', e.message); const orders = lsGet('akari_demo_orders', []); orders.unshift(order); lsSet('akari_demo_orders', orders); }

  if(checkoutState.payment==='mp'){
    if(!state.settings.mp_worker_url){
      toast('Mercado Pago no está configurado. Contactá a la tienda.');
      finalizeOrder(order); return;
    }
    try{
      const res = await fetch(state.settings.mp_worker_url, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ items: order.items.map(i=>({title:i.title, quantity:i.qty, unit_price:i.price})), order_ref: order.ref })
      });
      const data = await res.json();
      if(data.init_point){ window.location.href = data.init_point; return; }
      throw new Error('Sin init_point');
    }catch(e){ console.warn('Worker MP no disponible:', e.message); toast('No se pudo iniciar Mercado Pago, revisá con la tienda.'); }
  }
  finalizeOrder(order);
}
function finalizeOrder(order){
  state.lastOrder = order; lsSet('akari_last_order', order);
  state.cart = []; saveCart();
  location.hash = '#/exito';
}

      </div>
      <div class="field-row">
        <div class="field"><label>Match %</label><input id="pm-match" type="number" value="${p.match_score||80}"></div>
        <div class="field"><label>Orden</label><input id="pm-sort" type="number" value="${p.sort_order||1}"></div>
      </div>
      <div class="field"><label>URL de imagen</label><input id="pm-image" value="${p.image_url}"></div>
      <div class="toggle-row"><span class="mini" style="font-weight:700;color:var(--text)">Activo</span><button class="switch ${p.active?'on':''}" id="pm-active" onclick="this.classList.toggle('on')"></button></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn btn-outline btn-block" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary btn-block" onclick="saveProduct()">Guardar</button>
      </div>
    </div>
  </div>`;
}
async function saveProduct(){
  const p = adminModal.product;
  const updated = {
    ...p,
    title: $('#pm-title').value, brand: $('#pm-brand').value, category: $('#pm-category').value,
    price: Number($('#pm-price').value||0), original_price: Number($('#pm-original').value||0),
    match_score: Number($('#pm-match').value||80), sort_order: Number($('#pm-sort').value||1),
    image_url: $('#pm-image').value, active: $('#pm-active').classList.contains('on')
  };
  if(HAS_SUPABASE){
    try{
      if(adminModal.mode==='new') await sb('products', {method:'POST', body:JSON.stringify(updated)});
      else await sb(`products?id=eq.${p.id}`, {method:'PATCH', body:JSON.stringify(updated)});
      await loadData();
    }catch(e){ toast('Error guardando en Supabase: '+e.message); }
  } else {
    let list = allDemoProducts();
    if(adminModal.mode==='new') list.push(updated);
    else list = list.map(x=>x.id===p.id?updated:x);
    saveDemoProducts(list);
    state.products = list.filter(x=>x.active);
  }
  toast('Producto guardado'); closeModal();
}
async function deleteProduct(id){
  if(!confirm('¿Eliminar este producto?')) return;
  if(HAS_SUPABASE){
    try{ await sb(`products?id=eq.${id}`, {method:'DELETE'}); await loadData(); }catch(e){ toast('Error: '+e.message); }
  } else {
    saveDemoProducts(allDemoProducts().filter(x=>x.id!==id));
    state.products = allDemoProducts().filter(x=>x.active);
  }
  toast('Producto eliminado'); render();
}

/* -- Carga masiva CSV -- */
function adminBulk(){
  return `
  <div class="admin-card">
    <h3>Carga masiva de productos</h3>
    <p class="mini">Descargá la plantilla, completá filas y subí el CSV. Columnas: title, brand, category, price, original_price, match_score, image_url, sort_order, active.</p>
    <a class="btn btn-outline btn-sm" href="./supabase/plantilla-productos.csv" download><i data-lucide="download" class="icon" style="width:14px;height:14px"></i>Descargar plantilla CSV</a>
    <div class="field" style="margin-top:16px"><label>Subir CSV</label><input type="file" id="bulk-file" accept=".csv"></div>
    <button class="btn btn-primary" onclick="importCSV()"><i data-lucide="upload" class="icon" style="width:14px;height:14px"></i>Importar</button>
    <div id="bulk-result" class="mini" style="margin-top:10px"></div>
  </div>`;
}
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).filter(Boolean).map(line=>{
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (vals[i]||'').trim());
    return {
      id: uid(), title:obj.title, brand:obj.brand, category:obj.category,
      price:Number(obj.price||0), original_price:Number(obj.original_price||0),
      match_score:Number(obj.match_score||80), image_url:obj.image_url,
      sort_order:Number(obj.sort_order||1), active: obj.active!=='false' && obj.active!=='0'
    };
  });
}
async function importCSV(){
  const file = $('#bulk-file')?.files?.[0];
  if(!file){ toast('Elegí un archivo CSV'); return; }
  const text = await file.text();
  const rows = parseCSV(text);
  if(HAS_SUPABASE){
    try{ await sb('products', {method:'POST', body:JSON.stringify(rows)}); await loadData(); }
    catch(e){ $('#bulk-result').textContent = 'Error: '+e.message; return; }
  } else {
    saveDemoProducts([...allDemoProducts(), ...rows]);
    state.products = allDemoProducts().filter(x=>x.active);
  }
  $('#bulk-result').textContent = `${rows.length} productos importados correctamente.`;
  toast('Carga masiva completa');
}

    <p class="mini">El Access Token de Mercado Pago nunca se guarda acá: vive solo como variable de entorno en el Worker.</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary btn-sm" onclick="saveMpSettings()">Guardar</button>
      <button class="btn btn-outline btn-sm" onclick="testWorker()"><i data-lucide="zap" class="icon" style="width:14px;height:14px"></i>Probar Worker</button>
    </div>
    <div id="mp-test-result" class="mini" style="margin-top:8px"></div>

async function toggleSetting(key, btn){
  btn.classList.toggle('on');
  await patchSettings({[key]: btn.classList.contains('on')});

async function saveMpSettings(){
  await patchSettings({ mp_mode: $('#mp-mode').value, mp_public_key: $('#mp-pubkey').value, mp_worker_url: $('#mp-worker').value });
  toast('Configuración de pagos guardada');

async function testWorker(){
  const url = state.settings.mp_worker_url;
  const el = $('#mp-test-result');
  if(!url){ el.textContent='Ingresá la URL del Worker primero.'; return; }
  el.textContent = 'Probando...';
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items:[{title:'Test', quantity:1, unit_price:100}], order_ref:'TEST'})});
    el.textContent = res.ok ? 'Worker respondió correctamente ✔' : `Worker respondió con error ${res.status}`;
  }catch(e){ el.textContent = 'No se pudo contactar al Worker: '+e.message; }
}

/* ---------- 20. Render principal ---------- */
function currentView(){
  const route = state.route.split('?')[0];
  if(route==='#/' || route==='') return viewHome();
  if(route==='#/productos') return viewProductos();
  if(route==='#/carrito') return viewCarrito();
  if(route==='#/checkout') return viewCheckout();
  if(route==='#/exito') return viewExito();
  if(route==='#/vivo') return viewVivo();
  if(route==='#/contacto') return viewContacto();
  if(route==='#/admin') return viewAdmin();
  return `<div class="empty-state">Página no encontrada. <a href="#/">Volver al inicio</a></div>`;
}
function render(){
  const route = state.route.split('?')[0];
  document.getElementById('app').innerHTML = shellHTML(currentView());
  icons();
  if(route==='#/' || route==='') { renderFeedStage(); }
  if(route==='#/checkout') syncCheckoutInputs();
}

/* ---------- 21. Init ---------- */
(async function init(){
  await loadData();
  render();
})();
</script>
