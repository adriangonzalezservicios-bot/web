  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {

    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session?.access_token || SUPABASE_ANON_KEY}`,
      'Content-Type':'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...(opts.headers||{})

  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error(t || res.statusText); }

/* ---------- 6. Motor de gustos v3 (localStorage: akari_prefs_v3) ---------- */
const PREFS_KEY = 'akari_prefs_v3';
const HALF_LIFE_DAYS = 21;                 // cuánto tarda una preferencia en "olvidarse" a la mitad
const DECAY_LAMBDA = Math.log(2) / HALF_LIFE_DAYS;
const SIGNAL_WEIGHT = { like: 2, cart: 3.2, skip: -1.6, view: 0 };
const now_ = () => Date.now();
const daysSince = (ts) => ts ? (now_() - ts) / 86400000 : 999;
function decayFactor(ts){ return Math.exp(-DECAY_LAMBDA * Math.max(0, daysSince(ts))); }
function decayedValue(entry){ if(!entry) return 0; return entry.score * decayFactor(entry.ts); }

function loadPrefs(){
  const p = lsGet(PREFS_KEY, null);
  if(p && p.version===3) return p;
  // Migración simple desde v2 si existía, para no perder progreso del usuario
  const old = lsGet('akari_prefs_v2', null);
  const fresh = {
    version:3, categories:{}, brands:{}, priceMean:0, priceM2:0, priceCount:0,
    seen:{}, skipped:{}, session:[], totalSignals:0, createdAt: now_()
  };
  if(old){
    const ts = now_();
    Object.entries(old.categories||{}).forEach(([k,v])=> fresh.categories[k]={score:v, ts});
    Object.entries(old.brands||{}).forEach(([k,v])=> fresh.brands[k]={score:v, ts});
    if(old.priceCount){ fresh.priceCount=old.priceCount; fresh.priceMean=old.priceSum/old.priceCount; }
    Object.entries(old.seen||{}).forEach(([k,v])=> fresh.seen[k]={count:v, ts});
    Object.entries(old.skipped||{}).forEach(([k,v])=> fresh.skipped[k]={count:v, ts});
    fresh.session = old.session||[];
  }
  savePrefs(fresh);
  return fresh;
}
function savePrefs(p){ lsSet(PREFS_KEY, p); }

// Welford incremental: media y varianza de precios que le gustaron, sin guardar historial completo
function updatePriceStats(prefs, price){
  prefs.priceCount += 1;
  const delta = price - prefs.priceMean;
  prefs.priceMean += delta / prefs.priceCount;
  const delta2 = price - prefs.priceMean;
  prefs.priceM2 += delta * delta2;
}
function priceStd(prefs){
  if(prefs.priceCount < 2) return null;
  return Math.sqrt(prefs.priceM2 / prefs.priceCount);
}

function recordSignal(product, type){
  const prefs = loadPrefs();
  const weight = SIGNAL_WEIGHT[type] ?? 0;
  const ts = now_();
  if(weight !== 0){
    const catEntry = prefs.categories[product.category];
    prefs.categories[product.category] = { score: decayedValue(catEntry) + weight, ts };
    const brandEntry = prefs.brands[product.brand];
    prefs.brands[product.brand] = { score: decayedValue(brandEntry) + weight, ts };
    if(weight > 0) updatePriceStats(prefs, product.price);
    prefs.totalSignals += 1;
  }
  if(type==='skip'){
    const s = prefs.skipped[product.id];
    prefs.skipped[product.id] = { count: (s?s.count:0)+1, ts };
  }
  const seenEntry = prefs.seen[product.id];
  prefs.seen[product.id] = { count: (seenEntry?seenEntry.count:0)+1, ts };
  prefs.session.push(product.id);
  if(prefs.session.length>40) prefs.session.shift();
  savePrefs(prefs);
}

// Preferencia gaussiana de precio: 1.0 si está justo en el precio típico que le gusta, decae con la distancia
function priceFit(price, prefs){
  if(prefs.priceCount < 2) return 0.5; // sin datos suficientes: neutral
  const std = Math.max(priceStd(prefs), prefs.priceMean*0.12, 1000); // piso mínimo para no ser demasiado estricto
  const z = (price - prefs.priceMean) / std;
  return Math.exp(-0.5 * z * z); // 1 = precio ideal, ->0 = muy lejos de lo habitual
}

function scoreProduct(product, prefs, opts={}){
  const sessionSet = opts.sessionSet || new Set();
  let score = (product.match_score||70)/100;                 // base editorial 0–1

  const catAff = Math.tanh(decayedValue(prefs.categories[product.category]) / 4); // -1..1 acotado
  const brandAff = Math.tanh(decayedValue(prefs.brands[product.brand]) / 4);
  score += catAff * 0.22 + brandAff * 0.14;

  score += (priceFit(product.price, prefs) - 0.5) * 0.30;     // -0.15..+0.15

  const seenEntry = prefs.seen[product.id];
  if(!seenEntry){
    score += 0.16; // novelty: nunca visto
  } else {
    const recentness = decayFactor(seenEntry.ts);              // 1 = recién visto, ->0 con el tiempo
    score -= Math.min(0.32, 0.08 * Math.log(1 + seenEntry.count)) * recentness;
  }

  const skipEntry = prefs.skipped[product.id];
  if(skipEntry){
    const recentness = decayFactor(skipEntry.ts);
    score -= Math.min(0.85, 0.35 * skipEntry.count) * recentness;
  }

  if(sessionSet.has(product.id)) score -= 0.5;                 // evitar repetir en la misma sesión de scroll

  // exploración: más ruido cuando conocemos poco al usuario, casi nada cuando ya aprendimos de él
  const confidence = Math.min(1, prefs.totalSignals / 25);
  const noiseAmplitude = 0.14 * (1 - confidence) + 0.02;
  score += (Math.random()*2-1) * noiseAmplitude;

  return score;
}

function buildFeed(){
  const prefs = loadPrefs();
  const sessionSet = new Set(prefs.session.slice(-12));
  // filtrar productos rechazados con fuerza y recientemente, para no insistir
  const pool = state.products.filter(p=>{
    const sk = prefs.skipped[p.id];
    if(!sk) return true;
    return !(sk.count>=3 && decayFactor(sk.ts) > 0.6);
  });
  const finalPool = pool.length ? pool : state.products;

  let scored = finalPool
    .map(p=>({p, s:scoreProduct(p, prefs, {sessionSet})}))
    .sort((a,b)=>b.s-a.s);

  // exploración adaptativa: epsilon baja de ~25% (usuario nuevo) a un piso de 6% (usuario ya conocido)
  const confidence = Math.min(1, prefs.totalSignals / 25);
  const epsilon = 0.25 - confidence*0.19;
  let ordered = [];
  const rest = [...scored];
  while(rest.length){
    if(Math.random() < epsilon && rest.length>1){
      const idx = Math.floor(Math.random()*rest.length);
      ordered.push(rest.splice(idx,1)[0]);
    } else {
      ordered.push(rest.shift());
    }
  }

  // diversidad real: si insertar el siguiente ítem generaría 3 seguidos de la misma categoría,
  // buscamos más adelante en la cola el primer ítem de otra categoría y lo adelantamos.
  const final = [];
  while(ordered.length){
    const next = ordered[0];
    const lastTwoSame = final.length>=2
      && final[final.length-1].p.category===next.p.category
      && final[final.length-2].p.category===next.p.category;
    if(lastTwoSame){
      const altIdx = ordered.findIndex(o=> o.p.category!==next.p.category);
      if(altIdx > 0){ final.push(ordered.splice(altIdx,1)[0]); continue; }
    }
    final.push(ordered.shift());
  }
  return final.map(x=>x.p);
}

  const item = state.cart.find(i=>i.id===id);

  saveCart(); render();
}

let feedState = { items: [], index: 0 };
function feedHTML(){
  feedState.items = buildFeed();

  feedState.index = 0;
  return `
  <div class="feed-wrap">
    <div class="feed-stage" id="feed-stage"></div>
    <div class="feed-actions">
      <button class="round-btn skip" onclick="feedAction('skip')" title="Saltar"><i data-lucide="x" class="icon"></i></button>
      <button class="round-btn like" onclick="feedAction('like')" title="Me gusta"><i data-lucide="heart" class="icon"></i></button>
      <button class="round-btn add" onclick="feedAction('cart')" title="Agregar"><i data-lucide="shopping-cart" class="icon"></i></button>
    </div>
  </div>
  <div class="section-head" style="margin-top:26px"><h2 style="font-size:15px">Sugeridos para vos</h2></div>
  <div class="suggested-strip" id="suggested-strip"></div>
  `;
}
function renderFeedStage(){
  const stage = $('#feed-stage');
  if(!stage) return;
  stage.innerHTML='';
  const items = feedState.items.slice(feedState.index, feedState.index+2);
  if(!items.length){ stage.innerHTML = `<div class="feed-empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:24px">Reiniciando sugerencias...</div>`; icons(); setTimeout(()=>{feedState.index=0; renderFeedStage();},900); return; }
  items.slice().reverse().forEach((p,i)=>{
    const isTop = (i===items.length-1);
    const card = document.createElement('div');
    card.className='swipe-card';
    card.style.transform = isTop ? 'none' : 'scale(.94) translateY(10px)';
    card.style.zIndex = isTop? 2:1;
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="swipe-stamp like">ME GUSTA</div>
      <div class="swipe-stamp skip">PASO</div>
      <div class="imgwrap"><img src="${p.image_url}" alt="${p.title}"></div>
      <div class="info">
        <div class="cat">${p.category}</div>
        <div class="title">${p.title}</div>
        <div class="price">${fmtMoney(p.price)}</div>
      </div>
      <div class="match-badge" style="top:14px;right:14px">${p.match_score||70}% match</div>
    `;
    stage.appendChild(card);
    if(isTop) attachDrag(card, p);
  });
  renderSuggestedStrip();
  icons();
}
function attachDrag(card, product){
  let startX=0, startY=0, dx=0, dragging=false;
  const likeStamp = card.querySelector('.swipe-stamp.like');
  const skipStamp = card.querySelector('.swipe-stamp.skip');
  function onDown(x,y){ dragging=true; startX=x; startY=y; card.style.transition='none'; card.style.cursor='grabbing'; }
  function onMove(x,y){
    if(!dragging) return;
    dx = x-startX;
    const rot = dx/18;
    card.style.transform = `translate(${dx}px, ${(y-startY)*.15}px) rotate(${rot}deg)`;
    likeStamp.style.opacity = Math.min(Math.max(-dx/80,0),1);
    skipStamp.style.opacity = Math.min(Math.max(dx/80,0),1);
  }
  function onUp(){
    if(!dragging) return; dragging=false; card.style.cursor='grab'; card.style.transition='transform .25s ease, opacity .25s ease';
    if(dx<-110){ finishSwipe(card, product, 'like'); }
    else if(dx>110){ finishSwipe(card, product, 'skip'); }
    else { card.style.transform='none'; likeStamp.style.opacity=0; skipStamp.style.opacity=0; }
    dx=0;
  }
  card.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
  window.addEventListener('mouseup', onUp);
  card.addEventListener('touchstart', e=>{const t=e.touches[0]; onDown(t.clientX,t.clientY);}, {passive:true});
  card.addEventListener('touchmove', e=>{const t=e.touches[0]; onMove(t.clientX,t.clientY);}, {passive:true});
  card.addEventListener('touchend', onUp);
}
function finishSwipe(card, product, type){
  const dir = type==='like'?1:-1;
  card.style.transform = `translate(${dir*500}px, -40px) rotate(${dir*30}deg)`;
  card.style.opacity='0';
  recordSignal(product, type);
  feedState.index++;
  setTimeout(renderFeedStage, 200);
}
function feedAction(type){
  const p = feedState.items[feedState.index];
  if(!p) return;
  if(type==='cart') addToCart(p,1);
  const card = $(`#feed-stage .swipe-card[data-id="${p.id}"]`);
  if(card) finishSwipe(card, p, type==='cart'?'like':type);
  else { recordSignal(p, type==='cart'?'like':type); feedState.index++; renderFeedStage(); }
}
function renderSuggestedStrip(){
  const strip = $('#suggested-strip');
  if(!strip) return;
  const prefs = loadPrefs();
  const topCat = Object.entries(prefs.categories)
    .map(([k,v])=>[k, decayedValue(v)])
    .sort((a,b)=>b[1]-a[1])[0]?.[0];
  const hasPriceData = prefs.priceCount >= 2;
  const list = [...state.products].sort((a,b)=>scoreProduct(b,prefs)-scoreProduct(a,prefs)).slice(0,10);
  strip.innerHTML = list.map(p=>{
    let why = 'Recomendado';
    if(topCat && p.category===topCat) why = `Por ${topCat}`;
    else if(hasPriceData && priceFit(p.price, prefs) > 0.75) why = 'En tu rango de precio';
    else if(!prefs.seen[p.id]) why = 'Nuevo para vos';
    return `<a class="sugg-card" href="#/producto-${p.id}" onclick="event.preventDefault(); addToCart(state.products.find(x=>x.id==='${p.id}'))">
      <div class="imgwrap"><img src="${p.image_url}" alt="${p.title}" loading="lazy"></div>
      <div class="why">${why}</div>
      <div class="title">${p.title}</div>
    </a>`;
  }).join('');
}

async function submitOrder(){
  if(!checkoutState.name || !checkoutState.phone){ toast('Completá nombre y WhatsApp'); return; }
  const order = {
    ref: 'AK-' + Date.now().toString(36).toUpperCase(),
    items: state.cart, total: cartTotal(),
    customer:{name:checkoutState.name, phone:checkoutState.phone, email:checkoutState.email},
    delivery: checkoutState.delivery, address: checkoutState.address,
    payment: checkoutState.payment, status: 'pendiente', created_at: new Date().toISOString()
  };
  // Guardar orden (Supabase si hay backend, si no localStorage)
  try{
    if(HAS_SUPABASE){
      await sb('orders', { method:'POST', body: JSON.stringify(order) });
    } else {
      const orders = lsGet('akari_demo_orders', []); orders.unshift(order); lsSet('akari_demo_orders', orders);
    }
  }catch(e){ console.warn('No se pudo guardar el pedido en Supabase, se guarda local.', e.message); const orders = lsGet('akari_demo_orders', []); orders.unshift(order); lsSet('akari_demo_orders', orders); }

  if(checkoutState.payment==='mp'){
    if(!state.settings.mp_worker_url){
      showCheckoutError('Mercado Pago no está configurado todavía. Elegí otro método de pago o contactá a la tienda.');
      return; // NO se finaliza el pedido: no hubo pago real
    }
    const base = window.location.origin + window.location.pathname;
    try{
      const res = await fetch(state.settings.mp_worker_url, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          items: order.items.map(i=>({title:i.title, quantity:i.qty, unit_price:i.price})),
          order_ref: order.ref,
          success_url: base + '#/exito',
          failure_url: base + '#/checkout',
          pending_url: base + '#/exito'
        })
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.init_point){
        window.location.href = data.init_point;
        return; // se va a Mercado Pago; el pedido queda "pendiente" hasta que vuelva
      }
      // La API respondió pero sin init_point: mostramos el motivo real si vino
      const reason = data.error || data.detail?.message || 'Mercado Pago no devolvió un link de pago válido.';
      console.error('Worker MP respondió sin init_point:', data);
      showCheckoutError('No pudimos iniciar el pago con Mercado Pago (' + reason + '). Probá de nuevo o elegí otro método.');
    }catch(e){
      console.error('Worker MP no disponible:', e.message);
      showCheckoutError('No pudimos conectar con Mercado Pago. Probá de nuevo en un momento o elegí otro método de pago.');
    }
    return; // IMPORTANTE: si llegamos acá, el pago falló — nunca marcamos el pedido como recibido
  }
  finalizeOrder(order);
}
function showCheckoutError(msg){
  toast(msg);
  const box = $('#checkout-error');
  if(box){ box.textContent = msg; box.style.display = 'block'; }
}
function finalizeOrder(order){
  state.lastOrder = order; lsSet('akari_last_order', order);
  state.cart = []; saveCart();
  location.hash = '#/exito';
}

async function handleProductImageUpload(inputEl){
  const file = inputEl.files?.[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Elegí un archivo de imagen'); return; }
  if(file.size > 5*1024*1024){ toast('La imagen no puede pesar más de 5MB'); return; }
  const status = $('#pm-upload-status');

  if(!HAS_SUPABASE || !state.session){
    // Modo demo o sin sesión válida: vista previa local únicamente (no persiste en la nube)
    const reader = new FileReader();
    reader.onload = () => {
      $('#pm-image').value = reader.result;
      updateImagePreview(reader.result);
      if(status) status.textContent = 'Vista previa local (sin Supabase, no se guarda en la nube).';
    };
    reader.readAsDataURL(file);
    return;
  }

  if(status) status.textContent = 'Subiendo...';
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const path = `${Date.now()}-${uid()}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${state.session.access_token}`,
        'Content-Type': file.type
      },
      body: file
    });
    if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error(t || res.statusText); }
    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
    $('#pm-image').value = publicUrl;
    updateImagePreview(publicUrl);
    if(status) status.textContent = 'Imagen subida ✔';
  }catch(e){
    if(status) status.textContent = 'Error al subir: ' + e.message;
    toast('No se pudo subir la imagen');
  }
}

function adminBulk(){
  return `

    <div class="field" style="margin-top:16px"><label>Subir CSV</label><input type="file" id="bulk-file" accept=".csv"></div>
    <button class="btn btn-primary" onclick="importCSV()"><i data-lucide="upload" class="icon" style="width:14px;height:14px"></i>Importar</button>
    <div id="bulk-result" class="mini" style="margin-top:10px"></div>
  </div>`;
}
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).filter(Boolean).map(line=>{
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (vals[i]||'').trim());
    return {
      id: uid(), title:obj.title, brand:obj.brand, category:obj.category,
      price:Number(obj.price||0), original_price:Number(obj.original_price||0),
      match_score:Number(obj.match_score||80), image_url:obj.image_url,
      sort_order:Number(obj.sort_order||1), active: obj.active!=='false' && obj.active!=='0'
    };
  });
}
async function importCSV(){
  const file = $('#bulk-file')?.files?.[0];
  if(!file){ toast('Elegí un archivo CSV'); return; }
  const text = await file.text();
  const rows = parseCSV(text);
  if(HAS_SUPABASE){
    try{ await sb('products', {method:'POST', body:JSON.stringify(rows)}); await loadData(); }
    catch(e){ $('#bulk-result').textContent = 'Error: '+e.message; return; }
  } else {
    saveDemoProducts([...allDemoProducts(), ...rows]);
    state.products = allDemoProducts().filter(x=>x.active);
  }
  $('#bulk-result').textContent = `${rows.length} productos importados correctamente.`;
  toast('Carga masiva completa');
}

  <div class="table-scroll"><table class="admin-table">
    <thead><tr><th>Ref</th><th>Cliente</th><th>Total</th><th>Entrega</th><th>Pago</th><th>Fecha</th></tr></thead>
    <tbody>${orders.map(o=>`<tr><td>${o.ref}</td><td>${o.customer.name}<br><span class="mini">${o.customer.phone}</span></td><td>${fmtMoney(o.total)}</td><td>${o.delivery}</td><td>${o.payment}</td><td>${new Date(o.created_at).toLocaleString('es-AR')}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

/* -- Tienda -- */
function adminStore(){
  const s = state.settings;
  return `
  <div class="admin-card">
    <h3>Datos de la tienda</h3>
    <div class="field"><label>Nombre</label><input id="st-name" value="${s.brand_name}"></div>
    <div class="field"><label>Eslogan</label><input id="st-tag" value="${s.brand_tagline}"></div>
    <div class="field-row">
      <div class="field"><label>WhatsApp (solo números)</label><input id="st-wa" value="${s.whatsapp}"></div>
      <div class="field"><label>Email</label><input id="st-email" value="${s.email}"></div>
    </div>
    <div class="field"><label>Moneda</label><input id="st-currency" value="${s.currency}"></div>
  </div>
  <div class="admin-card">
    <h3>Sección En vivo</h3>
    <div class="toggle-row"><span class="mini" style="font-weight:700;color:var(--text)">Activa</span><button class="switch ${s.live_active?'on':''}" id="lv-active" onclick="this.classList.toggle('on')"></button></div>
    <div class="field"><label>Título</label><input id="lv-title" value="${s.live_title}"></div>
    <div class="field-row">
      <div class="field"><label>Cuándo</label><input id="lv-when" value="${s.live_when}"></div>
      <div class="field"><label>URL</label><input id="lv-url" value="${s.live_url}"></div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="saveStore()">Guardar cambios</button>`;
}
async function saveStore(){
  await patchSettings({
    brand_name: $('#st-name').value, brand_tagline: $('#st-tag').value,
    whatsapp: $('#st-wa').value, email: $('#st-email').value, currency: $('#st-currency').value,
    live_active: $('#lv-active').classList.contains('on'), live_title: $('#lv-title').value,
    live_when: $('#lv-when').value, live_url: $('#lv-url').value
  });
  toast('Tienda actualizada');
}
async function patchSettings(patch){
  state.settings = {...state.settings, ...patch};
  if(HAS_SUPABASE){
    try{ await sb('site_settings?id=eq.1', {method:'PATCH', body:JSON.stringify(patch)}); }catch(e){ toast('Error guardando en Supabase: '+e.message); }
  } else {
    saveDemoSettings({...lsGet('akari_demo_settings',{}), ...patch});
  }
  applyTheme(); render();
}

/* ---------- 20. Render principal ---------- */
function currentView(){
  const route = state.route.split('?')[0];
  if(route==='#/' || route==='') return viewHome();
  if(route==='#/productos') return viewProductos();
  if(route==='#/carrito') return viewCarrito();
  if(route==='#/checkout') return viewCheckout();
  if(route==='#/exito') return viewExito();
  if(route==='#/vivo') return viewVivo();
  if(route==='#/contacto') return viewContacto();
  if(route==='#/admin') return viewAdmin();
  return `<div class="empty-state">Página no encontrada. <a href="#/">Volver al inicio</a></div>`;
}
function render(){
  const route = state.route.split('?')[0];
  document.getElementById('app').innerHTML = shellHTML(currentView());
  icons();
  if(route==='#/' || route==='') { renderFeedStage(); }
  if(route==='#/checkout') syncCheckoutInputs();
}

/* ---------- 21. Init ---------- */
(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
